<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRO RESELLER DASHBOARD</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="wrap bar">
    <a href="/" class="brand"><span class="mark">PR</span>
      <span>Pro Reseller<small>Dashboard</small></span></a>
    <div class="spacer"></div>
    <div class="chip" id="balChip" hidden>Balance <b id="bal">0</b> cr</div>
    <a class="btn btn-ghost" href="/dashboard">My keys</a>
    <button class="btn btn-ghost" id="logout">Sign out</button>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <span class="eyebrow">Reseller tier · Instant delivery</span>
    <h1><em>PRO RESELLER</em> DASHBOARD</h1>
    <div class="trust">
      <span><b id="tPanels">0</b> panels live</span>
      <span><b id="tAvail">0</b> keys in stock</span>
      <span><b id="tSold">0</b> keys delivered</span>
      <span>1 credit = ₹1</span>
    </div>
  </section>

  <div class="section-head">
    <div>
      <h2>Available panels</h2>
      <p>Prices are set per duration. Stock updates in real time.</p>
    </div>
    <div class="spacer"></div>
    <button class="btn btn-ghost btn-sm" id="reload">Refresh stock</button>
  </div>

  <div class="grid" id="grid"></div>
</main>

<div class="modal-bg" id="keyModal">
  <div class="modal">
    <h3>Key delivered</h3>
    <p class="muted" id="keyMeta" style="margin:0 0 14px;font-size:13px"></p>
    <code id="keyVal" style="display:block;padding:13px;text-align:center;font-size:14px"></code>
    <div class="row" style="margin-top:16px">
      <button class="btn btn-ghost" id="keyCopy">Copy key</button>
      <a class="btn btn-gold" href="/dashboard">My keys</a>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me = null, panels = [];

function toast(msg, bad) {
  const t = $('toast');
  t.textContent = msg;
  t.style.borderColor = bad ? 'var(--bad)' : 'var(--emerald)';
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 2800);
}

async function api(path, opts = {}) {
  const r = await fetch(path, { credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, ...opts });
  if (r.status === 401 || r.status === 403) { location.href = '/login'; throw new Error('auth'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(d.error || 'Request failed'), { status: r.status });
  return d;
}

function logoHtml(p) {
  const letter = esc((p.name || '?').trim()[0] || '?');
  return `<div class="p-logo"><span>${letter}</span>${p.logo ? `<img src="${esc(p.logo)}" alt="" onerror="this.style.display='none'">` : ''}</div>`;
}

function render() {
  $('grid').innerHTML = panels.length ? panels.map(p => `
    <article class="p-card">
      <div class="p-top">
        ${logoHtml(p)}
        <div>
          <div class="p-tier">${esc(p.tier || 'RESELLER')}</div>
          <h3 class="p-name">${esc(p.name)}</h3>
          <p class="p-tag">${esc(p.tagline || 'Premium webmode access')}</p>
        </div>
      </div>
      <div class="plans">
        ${p.plans.length ? p.plans.map(pl => {
          const out = pl.in_stock === 0;
          const low = pl.in_stock > 0 && pl.in_stock < 5;
          return `<button class="plan ${out ? 'out' : ''} ${low ? 'low' : ''}" ${out ? 'disabled' : ''}
                    data-plan="${pl.id}" data-name="${esc(p.name)}" data-label="${esc(pl.label)}" data-price="${pl.price}">
            <span class="dur">${esc(pl.label)}</span>
            <span class="stock">${out ? 'sold out' : (low ? pl.in_stock + ' left' : pl.in_stock + ' in stock')}</span>
            <span class="price">${pl.price}</span>
          </button>`;
        }).join('') : '<p class="muted" style="font-size:13px;margin:4px 0">No plans configured yet.</p>'}
      </div>
    </article>`).join('')
    : '<p class="muted">No panels are live right now.</p>';
}

async function load() {
  const d = await api('/api/store');
  panels = d.panels;
  $('tPanels').textContent = d.meta.panels;
  $('tAvail').textContent = d.meta.keysAvailable;
  $('tSold').textContent = d.meta.keysDelivered;
  render();
}

$('grid').onclick = async e => {
  const btn = e.target.closest('.plan');
  if (!btn || btn.disabled) return;

  const { name, label, price, plan } = btn.dataset;
  if (!confirm(`Buy ${name} — ${label} for ₹${price} credits?`)) return;

  btn.disabled = true;
  try {
    const out = await api('/api/buy', { method: 'POST', body: JSON.stringify({ planId: Number(plan) }) });
    me.credits = out.credits;
    $('bal').textContent = me.credits;
    $('keyMeta').textContent = `${out.panel} — ${out.plan} · ₹${out.price} credits`;
    $('keyVal').textContent = out.key;
    $('keyModal').classList.add('open');
    await load();
  } catch (err) {
    if (err.message !== 'auth') { toast(err.message, true); load(); }
  } finally { btn.disabled = false; }
};

$('keyCopy').onclick = async () => {
  try { await navigator.clipboard.writeText($('keyVal').textContent); toast('Copied'); }
  catch { toast('Copy failed', true); }
};
$('keyModal').onclick = e => { if (e.target === $('keyModal')) $('keyModal').classList.remove('open'); };
$('reload').onclick = load;

$('logout').onclick = async () => {
  await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' });
  location.href = '/login';
};

(async () => {
  try {
    me = (await api('/api/me')).user;
    $('balChip').hidden = false;
    $('bal').textContent = me.credits;
    load();
  } catch {}
})();
</script>
</body>
</html>
